[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-bootstrap"
version = "0.1.0"
description = "A service that bootstraps CI into a repo: classify the language with an LLM, generate a 4-phase CI workflow from deterministic cookbooks, and open a pull request."
requires-python = ">=3.10"
dependencies = [
    "langchain-anthropic>=1.0",  # LLM calls via LangChain (ChatAnthropic + structured output)
    "langgraph>=1.0",            # CI->CD orchestration as a stateful graph
    "httpx>=0.27",       # GitHub REST API
    "pyyaml>=6.0",       # emit + self-validate the generated workflow
    "fastapi>=0.110",    # the service is the first-class interface
    "uvicorn>=0.29",     # ASGI server for the service
    "pydantic>=2.6",     # contracts
    "pynacl>=1.5",       # encrypt Actions secrets (libsodium sealed box)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cicd-bootstrap = "cicd_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cicd_bootstrap = [
    "cookbooks/cookbooks.yaml",        # CI cookbook data
    "cd_cookbooks/cd_cookbooks.yaml",  # CD deploy-recipe data
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
