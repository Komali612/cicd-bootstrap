# Desired deploy state for this app in the `prod` environment.
# The CD agent overwrites this file (image/tag/port) on the first prod deploy; merging a
# change here triggers Harness to deploy that env. Prod/staging need a CODEOWNERS approve.
app: APP_NAME
env: prod
image: ghcr.io/OWNER/APP_NAME
tag: ""
port: 8082
