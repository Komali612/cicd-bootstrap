# Desired deploy state for this app in the `staging` environment.
# The CD agent overwrites this file (image/tag/port) on the first staging deploy; merging a
# change here triggers Harness to deploy that env. Prod/staging need a CODEOWNERS approve.
app: APP_NAME
env: staging
image: ghcr.io/OWNER/APP_NAME
tag: ""
port: 8081
